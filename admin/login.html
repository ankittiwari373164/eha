<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff login | EHA Admin</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/assets/img/icon-32.png">
<link rel="stylesheet" href="/admin/assets/admin.css"></head>
<body><div class="login">
  <div class="art"><div class="orb"></div><svg viewBox="0 0 120 80"><path d="M6 46L60 8l54 38M22 36v38h76V36M50 74V52h20v22"/></svg>
    <h1>Every lead is<br>someone’s first home.</h1><p>EHA leads & CRM workspace</p></div>
  <form id="login" novalidate>
    <img src="/assets/img/logo.webp" alt="EHA">
    <h2 style="font-size:1.9rem">Staff sign in</h2>
    <div class="err" id="err"></div>
    <div class="fld"><label for="email">Email</label><input class="inp" id="email" type="email" autocomplete="username" required style="width:100%;padding:13px 14px"></div>
    <div class="fld"><label for="pw">Password</label><input class="inp" id="pw" type="password" autocomplete="current-password" required style="width:100%;padding:13px 14px"></div>
    <button class="btn" type="submit" style="justify-content:center;padding:14px">Sign in →</button>
    <a href="/" style="color:var(--muted);font-size:.88rem;text-align:center">← Back to website</a>
  </form>
</div>
<script src="/admin/assets/login.js"></script></body></html>
